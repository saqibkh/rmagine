name: GPU Simulator (HIP)

# Optional, non-required check. The hosted runners have no GPU, so this builds
# the HIP path of rmagine_cuda (USE_HIP=ON) and runs its ctest executables on
# a simulated AMD MI300X (gfx942) using PantheonSim
# (https://github.com/pantheongpu/pantheonsim). A simulator cannot reproduce
# hardware-specific behavior or timing, so it complements real-GPU testing and
# does not replace it.

on:
  push:
    branches: [ hip-sim-verify ]
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - "src/rmagine_core/**"
      - "src/rmagine_cuda/**"
      - "tests/cuda/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - ".github/workflows/gpu-sim-hip.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hip-tests:
    name: hip tests (ROCm 7.1 and simulated MI300X)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libtbb-dev \
            libboost-dev \
            libeigen3-dev \
            libassimp-dev \
            libjsoncpp-dev \
            cmake \
            ninja-build

      - name: Set up the simulated GPU and ROCm
        uses: pantheongpu/setup-pantheonsim@ca87fe3143b29166822b923d6050945c5179408c # v0.1.5
        with:
          gpu: amd/mi300x
          cuda-toolkit: none
          rocm: "7.1"

      # The action installs only the compiler side; hipRAND and the comgr CMake
      # config (needed by find_package(hip)) come on top.
      - name: Install hipRAND and comgr
        run: sudo apt-get install -y comgr hiprand-dev rocrand-dev rocm-cmake

      - name: Configure
        run: |
          ROCM=/opt/rocm
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_HIP=ON \
            -DCMAKE_HIP_ARCHITECTURES=gfx942 \
            -DCMAKE_HIP_COMPILER=$ROCM/lib/llvm/bin/clang++ \
            -DCMAKE_PREFIX_PATH=$ROCM \
            -DRMAGINE_EMBREE_DISABLE=ON \
            -DRMAGINE_OPTIX_DISABLE=ON \
            -DRMAGINE_VULKAN_DISABLE=ON \
            -DRMAGINE_VULKAN_CUDA_INTEROP_DISABLE=ON \
            -DRMAGINE_OUSTER_DISABLE=ON \
            -DRMAGINE_BUILD_TESTS=ON \
            -DRMAGINE_BUILD_TOOLS=OFF

      - name: Build
        run: cmake --build build -j3

      - name: Test
        run: vgpu run ctest --test-dir build --output-on-failure --no-tests=error -R '^cuda_'
